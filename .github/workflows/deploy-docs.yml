name: Deploy docs

# Every push to main ships the VitePress site to the Vercel production alias.
#
# This exists because Vercel's own Git integration is not installed for the team
# that owns the project, so pushes are not picked up on Vercel's side. If that
# integration is ever installed (Vercel → project → Settings → Git → Connect),
# it supersedes this workflow and this file can be deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight deploy irrelevant, so drop it rather than
# racing two deploys onto the same alias.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy token is present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Create one at" \
                 "https://vercel.com/account/tokens and add it with:" \
                 "gh secret set VERCEL_TOKEN"
            exit 1
          fi

      # The build itself runs on Vercel, driven by vercel.json, so this job
      # needs the CLI and nothing else — no bun install, no local build.
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_iVzXBwLnuGsnY1KrkEx6IVMa
          VERCEL_PROJECT_ID: prj_lE4EaDxGnHa155mnii0S3c2BVlE6
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
