name: Release

on:
  push:
    branches: [main]
  # Re-runnable by hand: publishing skips versions the registry already has, so
  # a run that died between the tag push and the last package can be finished
  # without inventing new version numbers.
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish the versions already in the manifests, without computing a new release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the versions and changelogs, push tags, cut releases
  id-token: write # npm's trusted-publisher OIDC exchange, and provenance

jobs:
  release:
    name: version · changelog · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag: the bump is computed from the
          # commits since a package's last tag, and a shallow clone has neither.
          # Asked for explicitly rather than relied on, because a checkout
          # without the tags does not fail — it reads every package as never
          # released and re-bumps the entire workspace off the whole history.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm CLI 11.5.1+, which needs this floor —
          # https://docs.npmjs.com/trusted-publishers. `setup-node` only
          # resolves what its manifest already has cached, so the version is
          # upgraded explicitly below rather than trusted to whatever a bare
          # "22" resolves to on the day the runner image was built.
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      # Pinned rather than `@latest`: npm keeps raising its own Node floor
      # (12.x wants Node 22.22+), and this workflow only needs to clear the
      # trusted-publishing minimum, not track the newest release. 11.5.1 is
      # that minimum, and it runs on the Node 22.14.0 pinned above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - run: bun install --frozen-lockfile

      # The same gate CI runs, run again here against the merge result: a green
      # pull request plus a green main are not the same claim.
      - name: Check
        run: bun run check

      - name: Package size
        run: bun run pack-size

      - name: Work out the release
        id: plan
        run: |
          bun run scripts/release.ts --json > /tmp/plan.json
          cat /tmp/plan.json
          {
            echo "count=$(bun -e 'console.log((await Bun.file("/tmp/plan.json").json()).length)')"
            echo "names=$(bun -e 'console.log((await Bun.file("/tmp/plan.json").json()).map(p => p.name).join(","))')"
          } >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.count == '0' && !inputs.publish_only
        run: echo "No releasable commits since the last tags."

      # Versions and changelogs are written to disk here, but this is as far
      # as anything permanent goes until npm confirms it. Everything below —
      # the git commit, the tags, the push, the GitHub releases — waits on
      # `Publish to npm` succeeding, in that order, on purpose: a version this
      # repo has tagged and pushed is a promise that the same version exists
      # on the registry, and the one thing worse than a failed release is a
      # green-looking `main` that made that promise and did not keep it. The
      # run that failed here before this reordering did exactly that — it
      # tagged and half-pushed 35 packages nothing had published yet.
      - name: Write versions and changelogs
        if: steps.plan.outputs.count != '0' && !inputs.publish_only
        run: bun run scripts/release.ts

      # `--ci` authenticates via npm's trusted-publisher OIDC exchange, using
      # the `id-token: write` permission above — no npm token lives in this
      # repo. That needs a trusted publisher configured per package on
      # npmjs.com first (Settings -> Trusted Publisher -> GitHub Actions,
      # this repo, workflow file `release.yml`); a package with none 403s.
      # `NPM_TOKEN` is read as a fallback if that secret ever gets set, so a
      # package that cannot use OIDC yet is not a reason to block the rest.
      #
      # Reads the versions `Write versions and changelogs` just put on disk —
      # `stageAll` takes them from `packages/*/package.json` directly, not
      # from git, so nothing here needs that write committed first. And it is
      # resumable on its own terms: before publishing anything it asks the
      # registry what already exists and skips it, so a rerun of this same
      # plan — which recomputes identically, because nothing before this
      # point ever got committed — picks up exactly where a partial failure
      # left off instead of re-publishing or renumbering what already shipped.
      - name: Publish to npm
        id: publish
        if: steps.plan.outputs.count != '0' || inputs.publish_only
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.publish_only }}" = "true" ]; then
            bun run scripts/publish.ts --ci --skip-checks
          else
            bun run scripts/publish.ts --ci --skip-checks --only "${{ steps.plan.outputs.names }}"
          fi

      # The real, permanent version bump. Gated on `Publish to npm` actually
      # succeeding — not merely having run — so a failed or partial publish
      # leaves the repo exactly as it found it: no commit, no tag, nothing
      # for the next run to disagree with. That next run recomputes the same
      # plan from the same last-real tags and the publish step's own registry
      # check resumes it; this step never gets a chance to tag a version that
      # is not actually on npm.
      - name: Commit, tag and push
        if: steps.plan.outputs.count != '0' && !inputs.publish_only && steps.publish.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/*/CHANGELOG.md
          git commit -m "chore(release): publish ${{ steps.plan.outputs.count }} package(s) [skip ci]"
          bun -e '
            const plans = await Bun.file("/tmp/plan.json").json();
            for (const p of plans) console.log(`${p.name}@${p.to}`);
          ' | while read -r tag; do git tag -a "$tag" -m "$tag"; done
          git push --follow-tags origin HEAD:main

      - name: Cut GitHub releases
        if: steps.plan.outputs.count != '0' && !inputs.publish_only && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun -e '
            const plans = await Bun.file("/tmp/plan.json").json();
            for (const p of plans) console.log(`${p.name}\t${p.to}\t${p.dir}`);
          ' | while IFS=$'\t' read -r name version dir; do
            # The section the release script just prepended is the release note.
            CHANGELOG="$dir/CHANGELOG.md" bun -e '
              const text = await Bun.file(process.env.CHANGELOG).text();
              const sections = text.split(/^## /m).slice(1);
              console.log(sections.length ? `## ${sections[0].trim()}` : "");
            ' > /tmp/notes.md
            gh release create "$name@$version" --title "$name@$version" --notes-file /tmp/notes.md
          done
